# --- Required paths (relative paths are resolved against this file) ---
root = C:/Data/PseudoPFLOW
inputDir = C:/Data/PseudoPFLOW/processing
outputDir = D:/large/PseudoPFLOW/

# --- Optional switches for batch runs ---
mfactor = 10
prefecture.codes = 28
activity.subdir = activity_v2
# empty value to process all CSVs
activity.file.filter = kobe_bus_act_updated.csv

# --- Mode choice / cost parameters (defaults match the code) ---

# meters threshold for considering transit
min.transit.distance = 1000
# JPY per km (vehicle)
fare.per.km          = 51
# JPY per hour time value
fare.per.hour        = 1000
# walking fatigue multiplier
fatigue.walk         = 2.5
# bicycle fatigue multiplier
fatigue.bicycle      = 1.5
# JPY initial vehicle cost
fare.init            = 250
# probability to allow car without ownership
car.availability     = 0.4
# probability of commuter pass (fare=0) when purpose is commute/school
commuter.pass.rate   = 0.5

# --- API / Session (examples; replace with real endpoints) ---
api.userID=Pang_Yanbo
api.password=Pyb-37167209
api.createSessionURL=https://pflow-api.csis.u-tokyo.ac.jp/webapi/CreateSession
api.getRoadRouteURL=https://pflow-api.csis.u-tokyo.ac.jp/webapi/GetRoadRoute
api.getMixedRouteURL=https://pflow-api.csis.u-tokyo.ac.jp/webapi/GetMixedRoute

# --- Per-prefecture car/bike (fallback if not available: car.default / bike.default) ---
car.default = 0.40
bike.default = 0.30
