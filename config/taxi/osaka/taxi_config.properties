# ══════════════════════════════════════════════════════════════════════════
#  OSAKA TAXI ABM - COMPLETE CONFIGURATION FILE
#  Version 5.0 - Updated with 2024/2025 statistics
# ══════════════════════════════════════════════════════════════════════════
#
# DATA SOURCES:
#   Fleet size:  MLIT Japan / Tokyo Hire-Taxi Association (THTA) / Statista
#   Fare rates:  Tokyo Hire-Taxi Association official rates table
#                Kyoto Taxi Association official fare list
#                nagoyastation.com / osakastation.com local fare info
#                taxi-calculator.com tariff ordinances (Jan 2025)
#                gobytaxi.com per-km rates
#   Demand:      Tokyo taxi survey, MLIT transport statistics
#   General:     japan-guide.com, japan-dev.com taxi guides

# ====== DIRECTORY CONFIGURATION ======

input.directory=${PFLOW_HOME}/data/
output.directory=${PFLOW_HOME}/output/trips/taxi/osaka/

# ====== FLEET CONFIGURATION (Osaka FY2024 — 令和6年度 verified) ======
# Sources:
#   大阪タクシー協会 報告書 (法人 14,265 + 個人 2,278 = 16,543, 大阪府全体)
#   MLIT 近畿運輸局 6-14 法人タクシー輸送実績推移 R6
#   https://wwwtb.mlit.go.jp/kinki/content/2024youran6-14.pdf

# Total registered taxis (法人 + 個人, 大阪府全体 FY2024)
taxi.total.registered=16543

# Operating rate 実働率 (法人 大阪府 FY2024 annual avg) — MLIT 近畿運輸局
taxi.operating.rate=0.583

# Active daily fleet (= 16,543 × 0.583)
taxi.fleet.size=9645

# ====== TRIP CONFIGURATION (MLIT 近畿運輸局 R6) ======
# 1日1車当り 運送回数 法人 大阪府 FY2024 = 18.5 (vs Tokyo 25.3)

taxi.trips.average=18
taxi.trips.min=14
taxi.trips.max=40
taxi.trips.stddev=4.0

# ====== DISTANCE PARAMETERS (MLIT 近畿運輸局 R6) ======
# 1車1回当り 実車㌔ ≈ 4.5 km (similar to Tokyo)
# 1日1車当り 走行キロ = 181.7 km (vs Tokyo 243.7)

trip.distance.average=4.5
trip.distance.stddev=3.0
trip.distance.min=0.5
trip.distance.max=15.0

# ====== NEARBY TRIP LOGIC ======

use.nearby.trips=true
nearby.trip.probability=0.80
nearby.trip.radius.km=2.5

# ====== SHIFT CONFIGURATION ======

shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

shift.start.1.time=06:00
shift.start.1.probability=0.40

shift.start.2.time=14:00
shift.start.2.probability=0.30

shift.start.3.time=22:00
shift.start.3.probability=0.30

# ====== SIMULATION TIME PARAMETERS ======

sim.start.time=06:00
sim.duration.hours=24
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======

taxi.average.speed=19
distance.manhattan.factor=1.4
taxi.pickup.time=300
taxi.break.time=600

# ====== CITY & GEOGRAPHICAL PARAMETERS ======

city.name=Osaka

city.bounds.min.lon=135.20
city.bounds.max.lon=135.75
city.bounds.min.lat=34.38
city.bounds.max.lat=34.90

earth.radius.km=6371.0

# ====== HOTSPOT CONFIGURATION ======

use.hotspots=true
hotspot.probability=0.70
hotspot.airport.night.multiplier=2.0
hotspot.night.start=22:00
hotspot.night.end=06:00

# ====== HOTSPOT LOCATIONS ======

hotspot.1.name=Osaka/Umeda Station
