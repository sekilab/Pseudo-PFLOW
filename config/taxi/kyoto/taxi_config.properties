# ══════════════════════════════════════════════════════════════════════════
#  KYOTO TAXI ABM - CONFIGURATION FILE
#  Based on Kyoto Prefecture taxi operations (tourism-heavy patterns)
# ══════════════════════════════════════════════════════════════════════════

# ====== DIRECTORY CONFIGURATION ======
input.directory=N:/PFLOW/data/
output.directory=N:/PFLOW/output/kyoto/

# ====== CITY & GEOGRAPHICAL PARAMETERS ======
city.name=Kyoto
city.bounds.min.lon=135.70
city.bounds.max.lon=135.82
city.bounds.min.lat=34.95
city.bounds.max.lat=35.06

earth.radius.km=6371.0

# ====== FLEET CONFIGURATION ======
taxi.total.registered=8000
taxi.operating.rate=0.80
taxi.fleet.size=6400

# ====== TRIP CONFIGURATION ======
# Kyoto trips are shorter due to compact city layout
taxi.trips.average=20
taxi.trips.min=12
taxi.trips.max=32
taxi.trips.stddev=3.0

# ====== DISTANCE PARAMETERS ======
trip.distance.average=4.5
trip.distance.stddev=2.0
trip.distance.min=0.5
trip.distance.max=20.0

# ====== NEARBY TRIP LOGIC ======
use.nearby.trips=true
nearby.trip.probability=0.72
nearby.trip.radius.km=2.0

# ====== SHIFT CONFIGURATION ======
shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

shift.start.1.time=06:00
shift.start.1.probability=0.40
shift.start.2.time=14:00
shift.start.2.probability=0.35
shift.start.3.time=22:00
shift.start.3.probability=0.25

# ====== SIMULATION TIME ======
sim.start.time=06:00
sim.duration.hours=24
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======
# Kyoto is slow due to narrow streets and tourist traffic
taxi.average.speed=16
distance.manhattan.factor=1.5
taxi.pickup.time=300
taxi.break.time=600

# ====== HOTSPOT CONFIGURATION ======
use.hotspots=true
hotspot.probability=0.70
hotspot.airport.night.multiplier=1.5
hotspot.night.start=22:00
hotspot.night.end=06:00

# ====== FARE PARAMETERS (Kyoto Prefecture rates) ======
taxi.fare.base=490
taxi.fare.base.distance=1.2
taxi.fare.per.km=320
taxi.fare.waiting.per.hour=2940
taxi.fare.night.surcharge=1.20
taxi.fare.night.start=22:00
taxi.fare.night.end=05:00

# ====== RANDOM SEED ======
random.seed=45678

# ====== TAXI TYPE DISTRIBUTION ======
# Kyoto: more LOCAL taxis near tourist districts, fewer HUB (no airport)
taxi.type.local.prob=0.75
taxi.type.citywide.prob=0.20
taxi.type.hub.prob=0.05
taxi.type.local.familiar.radius.km=3.0

# ====== ZONE CLUSTERING ======
zone.cluster.min.zones=3
zone.cluster.max.zones=4
zone.cluster.min.distance.km=2.0
zone.cluster.max.distance.km=6.0

# ====== ZONE CONFIGURATION ======
zones.file=zones.csv

# ====== TIME PERIODS ======
time.period.1.start=06:00
time.period.1.end=18:00
time.period.2.start=18:00
time.period.2.end=24:00

# ====== ATTRACTIVENESS COEFFICIENTS ======
# Kyoto: tourism drives shopping and nightlife demand strongly
attractiveness.beta1.jobs=0.8
attractiveness.beta2.shops=1.0
attractiveness.beta3.nightlife=0.9
attractiveness.beta4.residential=0.5

# ====== VALIDATION TARGETS ======
validation.daily.trips=128000
validation.avg.trips.per.taxi=20
validation.avg.trip.distance.min=3.0
validation.avg.trip.distance.max=6.0

# ====== SPATIAL VALIDATION ======
# ====== CITY BOUNDARY (PREFECTURE POLYGONS) ======
city.prefecture.codes=26,25,27,28

spatial.validation.enabled=true
spatial.shapefile.dir=src/taxi/gm-jp/
spatial.river.buffer.km=0.15

# ====== TRANSPORT NETWORK INDEX ======
transport.index.enabled=true
transport.station.proximity.max.km=2.0
transport.station.bias.probability=0.4

# ====== ZONE ENRICHMENT FROM SHAPEFILES ======
zone.enrichment.enabled=false
zone.enrichment.station.coverage.km=1.5
zone.enrichment.settlement.coverage.km=2.0

# ====== OUTPUT CONFIGURATION ======
export.format=csv
export.trajectories=true
export.compression=none
export.datetime.format=MM/dd/yyyy HH:mm
export.timestamp.format=yyyyMMdd_HHmmss
