# ══════════════════════════════════════════════════════════════════════════
#  TOKYO TAXI ABM - COMPLETE CONFIGURATION FILE
#  Version 3.0 - All Parameters Configurable
# ══════════════════════════════════════════════════════════════════════════

# ====== DIRECTORY CONFIGURATION ======

# Input data directory (where your data files are stored)
input.directory=N:/PFLOW/data/

# Output data directory (where results will be saved)
output.directory=N:/PFLOW/output/taxi/tokyo/

# ====== FLEET CONFIGURATION (REAL TOKYO DATA) ======

# Total number of registered taxis in Tokyo
taxi.total.registered=50000

# Operating rate (percentage of taxis active daily)
# 0.80 = 80% of registered taxis operate each day
taxi.operating.rate=0.80

# Number of taxis in simulation (overrides calculated value from above)
# Set to -1 to use calculated value (total × operating.rate)
# Or set specific number for testing (e.g., 1000 for quick tests)
taxi.fleet.size=40000

# ====== TRIP CONFIGURATION (REAL TOKYO DATA) ======

# Average trips per taxi per day (from Tokyo taxi survey = 26.8)
taxi.trips.average=27

# Minimum trips per taxi (for Gaussian variation)
taxi.trips.min=20

# Maximum trips per taxi (for Gaussian variation)
taxi.trips.max=50

# Standard deviation for trips per taxi (Gaussian distribution)
taxi.trips.stddev=4.0

# ====== DISTANCE PARAMETERS (REAL TOKYO DATA) ======

# Average trip distance in kilometers (Tokyo survey: 4-6 km)
trip.distance.average=9

# Standard deviation for trip distance (Gaussian distribution)
trip.distance.stddev=4.0

# Minimum trip distance (km) - reject trips shorter than this
trip.distance.min=0.5

# Maximum trip distance (km) - reject trips longer than this
trip.distance.max=30.0

# ====== NEARBY TRIP LOGIC ======

# Enable nearby trip logic (true/false)
# If true, taxis will pick up next passenger near previous dropoff
use.nearby.trips=true

# Probability that next trip starts near previous dropoff
# 0.70 = 75% of trips are nearby, 25% use hotspot generation
nearby.trip.probability=0.75

# Radius for nearby trips (km)
# Next pickup will be within this distance of last dropoff
nearby.trip.radius.km=2.5

# ====== SHIFT CONFIGURATION (REAL TOKYO DATA) ======

# Shift duration in hours
shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

# Shift start times and their probabilities
# Format: shift.start.N.time = HH:MM
#         shift.start.N.probability = 0.XX

# Early morning shift (40% of taxis)
shift.start.1.time=06:00
shift.start.1.probability=0.40

# Afternoon shift (30% of taxis)
shift.start.2.time=14:00
shift.start.2.probability=0.30

# Night shift (30% of taxis)
shift.start.3.time=22:00
shift.start.3.probability=0.30

# ====== SIMULATION TIME PARAMETERS ======

# Simulation start time (HH:MM)
sim.start.time=06:00

# Simulation duration in hours
sim.duration.hours=24

# Time step in seconds (for future time-step simulation)
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======

# Average taxi speed in Tokyo (km/h)
taxi.average.speed=20

# Manhattan distance factor (to approximate road network from straight-line)
# Straight-line distance × factor = approximate road distance
distance.manhattan.factor=1.4

# Pickup time (seconds to reach customer after trip assignment)
taxi.pickup.time=300

# Break time between trips (seconds)
taxi.break.time=600

# ====== CITY & GEOGRAPHICAL PARAMETERS ======

# City name (for display in banner and output)
city.name=Tokyo

# City bounding box (generic keys — used by all cities)
city.bounds.min.lon=139.6
city.bounds.max.lon=139.9
city.bounds.min.lat=35.5
city.bounds.max.lat=35.8

# Earth radius for Haversine distance calculation (km)
# Used to calculate straight-line distance between two lat/lon points
earth.radius.km=6371.0

# ====== HOTSPOT CONFIGURATION ======

# Use hotspots for trip generation (true/false)
# If true, trips will concentrate around major stations
use.hotspots=true

# Hotspot probability when not using nearby trips
# If nearby trip logic doesn't apply, use hotspot with this probability
hotspot.probability=0.70

# Time-weighted hotspots
# Multiply airport weights during late night/early morning
hotspot.airport.night.multiplier=2.0

# Late night/early morning time range (HH:MM)
hotspot.night.start=22:00
hotspot.night.end=06:00

# ====== HOTSPOT LOCATIONS ======
# Format: hotspot.N.name, hotspot.N.lon, hotspot.N.lat, hotspot.N.weight
# Weight is relative probability (will be normalized)

# Major stations
hotspot.1.name=Tokyo Station
hotspot.1.lon=139.7673
hotspot.1.lat=35.6809
hotspot.1.weight=0.20
hotspot.1.type=station

hotspot.2.name=Shinjuku Station
hotspot.2.lon=139.7005
hotspot.2.lat=35.6762
hotspot.2.weight=0.18
hotspot.2.type=station

hotspot.3.name=Shibuya Station
hotspot.3.lon=139.7103
hotspot.3.lat=35.6586
hotspot.3.weight=0.15
hotspot.3.type=station

# Airports (CRITICAL for late night/early morning)
hotspot.4.name=Haneda Airport
hotspot.4.lon=139.7798
hotspot.4.lat=35.5494
hotspot.4.weight=0.15
hotspot.4.type=airport

hotspot.5.name=Narita Airport Area
hotspot.5.lon=140.3864
hotspot.5.lat=35.7653
hotspot.5.weight=0.12
hotspot.5.type=airport

# Other major hubs
hotspot.6.name=Ueno Station
hotspot.6.lon=139.8107
hotspot.6.lat=35.7100
hotspot.6.weight=0.08
hotspot.6.type=station

hotspot.7.name=Ikebukuro Station
hotspot.7.lon=139.7111
hotspot.7.lat=35.7295
hotspot.7.weight=0.07
hotspot.7.type=station

hotspot.8.name=Roppongi Area
hotspot.8.lon=139.7308
hotspot.8.lat=35.6642
hotspot.8.weight=0.05
hotspot.8.type=entertainment

# ====== FARE PARAMETERS (TOKYO TAXI OFFICIAL RATES) ======

# Base fare (Japanese Yen)
taxi.fare.base=730

# Distance included in base fare (km)
taxi.fare.base.distance=2.0

# Fare per kilometer after base distance (Yen/km)
taxi.fare.per.km=320

# Waiting/standing fare (Yen/hour when speed < 10 km/h)
taxi.fare.waiting.per.hour=3085

# Night surcharge multiplier (22:00-05:00)
# 1.20 = 20% increase during night hours
taxi.fare.night.surcharge=1.20

# Night hours for fare surcharge (HH:MM)
taxi.fare.night.start=22:00
taxi.fare.night.end=05:00

# ====== PHYSICAL CONSTANTS ======

# ====== RANDOM SEED ======

# Random seed for reproducibility
# Use -1 for random seed each run
# Use positive number (e.g., 12345) for reproducible results
random.seed=12345

# ══════════════════════════════════════════════════════════════════════════
#  V4.0 ENHANCEMENTS - HETEROGENEOUS AGENTS & TIME-DEPENDENT ATTRACTIVENESS
# ══════════════════════════════════════════════════════════════════════════

# ====== TAXI TYPE DISTRIBUTION (V4.0) ======

# Probability of each taxi type
# LOCAL: Operate within 3-5 familiar zones clustered geographically (60-70%)
# CITYWIDE: Roam across all zones with larger cruising range (20-30%)
# HUB: Concentrate around transport hubs (airports/major stations) (10-20%)
taxi.type.local.prob=0.65
taxi.type.citywide.prob=0.25
taxi.type.hub.prob=0.10

# Familiar area radius for LOCAL type taxis (km) - LEGACY
# V4.0: LOCAL taxis now use zone clustering instead of radius
# This parameter is kept for fallback and backward compatibility
taxi.type.local.familiar.radius.km=5.0

# ====== ZONE CLUSTERING (V4.0) ======
# For LOCAL taxis: familiar zone assignment parameters

# Number of familiar zones to assign (3-5 zones)
zone.cluster.min.zones=3
zone.cluster.max.zones=5

# Distance range for zone clustering (km)
# Zones should be within this range of the seed zone
zone.cluster.min.distance.km=5.0
zone.cluster.max.distance.km=10.0

# ====== ZONE CONFIGURATION ======

# Path to zones CSV file (relative to config directory)
zones.file=zones.csv

# ====== TIME PERIODS FOR ATTRACTIVENESS ======

# Three time periods per day for destination attractiveness calculation
# Period 1: Daytime (06:00-18:00) - residential and office areas high
time.period.1.start=06:00
time.period.1.end=18:00

# Period 2: Evening (18:00-00:00) - business/shopping districts high
time.period.2.start=18:00
time.period.2.end=24:00

# Period 3: Night (00:00-06:00) - entertainment/nightlife and residential high
# After trains stop, airports get 2x weight boost
# 00:00 to 06:00 (implicit)

# ====== ATTRACTIVENESS COEFFICIENTS ======

# Beta coefficients for destination attractiveness scoring
# A_j = β1·jobs_j + β2·shops_j + β3·nightlife_j + β4·residential_j
# Higher coefficient = stronger influence on destination choice

# Jobs coefficient (office/business areas)
attractiveness.beta1.jobs=1.0

# Shops coefficient (shopping/retail areas)
attractiveness.beta2.shops=0.8

# Nightlife coefficient (entertainment/nightlife areas)
attractiveness.beta3.nightlife=0.6

# Residential coefficient (residential areas)
attractiveness.beta4.residential=0.5

# ====== VALIDATION TARGETS (FOR REFERENCE) ======
# These are not used by the simulation but document expected values

# Total daily trips in Tokyo (from survey)
validation.daily.trips.tokyo=433000

# Expected results for validation
validation.avg.trips.per.taxi=26.8
validation.avg.trip.distance.min=4.0
validation.avg.trip.distance.max=6.0
validation.nearby.trip.percentage=0.70

# ====== CITY BOUNDARY (PREFECTURE POLYGONS) ======
# Comma-separated 2-digit prefecture codes from polbnda_jpn.shp adm_code prefix
# Tokyo metro: 13=Tokyo-to, 14=Kanagawa (for Shinyokohama/southern zones)
city.prefecture.codes=13,14

# ====== SPATIAL VALIDATION ======

# Enable shapefile-based geographic validation (land/water/river checks)
spatial.validation.enabled=true

# Directory containing Japan-wide shapefiles (polbnda, inwatera, riverl)
spatial.shapefile.dir=src/taxi/gm-jp/

# River buffer exclusion distance (km) — points within this distance of river centerlines are rejected
spatial.river.buffer.km=0.15

# ====== TRANSPORT NETWORK INDEX ======
# Station/airport proximity enrichment (uses rstatp_jpn.shp + airp_jpn.shp)
transport.index.enabled=true
transport.station.proximity.max.km=2.0
transport.station.bias.probability=0.4

# ====== ZONE ENRICHMENT FROM SHAPEFILES ======
# Append zones from shapefile features (settlements, stations) not covered by zones.csv
zone.enrichment.enabled=false
zone.enrichment.station.coverage.km=1.5
zone.enrichment.settlement.coverage.km=2.0

# ====== OUTPUT CONFIGURATION ======

# Export format (csv, json, both)
export.format=csv

# Include trajectory data in export (true/false)
export.trajectories=true

# Compression for large files (none, gzip, zip)
export.compression=none

# CSV datetime format (for time columns in output files)
# Default: MM/dd/yyyy HH:mm
# Java SimpleDateFormat patterns:
#   yyyy = 4-digit year, MM = month, dd = day
#   HH = 24-hour, mm = minute, ss = second
export.datetime.format=MM/dd/yyyy HH:mm

# Timestamp format for output directory naming
# Default: yyyyMMdd_HHmmss (e.g., run_20241127_143052)
export.timestamp.format=yyyyMMdd_HHmmss

# ====== DATA FILE PATHS (relative to input directory) ======
# These are for future enhancements when reading real data

# Road network
data.network.road=network/drm_tokyo.tsv
data.network.rail=network/railnetwork.tsv

# Points of Interest
data.poi.depots=poi/taxi_depot.csv
data.poi.stations=poi/base_station.csv
data.poi.hospitals=poi/city_hospital.csv

