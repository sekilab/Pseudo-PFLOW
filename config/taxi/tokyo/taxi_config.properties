# ══════════════════════════════════════════════════════════════════════════
#  TOKYO TAXI ABM - COMPLETE CONFIGURATION FILE
#  Version 6.0 - Updated 2026-04-25 with verified THTA FY2024 statistics
# ══════════════════════════════════════════════════════════════════════════
#
# DATA SOURCES (all aggregated regulatory statistics — no GPS, no app logs):
#   Fleet:       THTA 令和6年度事業報告書 (FY2024), 2025-07-03
#                  https://taxi-tokyo.or.jp/assets/pdf/about/dis202507_03.pdf
#                  Source ID [#1] in references/taxi_data_sources/MASTER_SOURCES.md
#   Operating:   THTA FY2024 p.1 — 実働率 68.6%, 実車率 47.5% (annual avg, 特別区・武三)
#   Trips/dist:  THTA FY2024 p.13 [資料5-1] — 25.3 trips/active-taxi/day, 243.7 km/day, 4.6 km/trip
#   Revenue:     THTA FY2024 p.13 — 日車営収 ¥56,139 (税抜)
#   Fare rates:  全ハイ連 Taxi Today in Japan 2025, eff. 2022-11-14
#                  https://taxi-japan.or.jp/zius/uploads/Taxi_Today_2025.pdf
#                  Source ID [#4]
#   Speed:       MLIT 令和3年度全国道路・街路交通情勢調査 (R3 2021 census)
#                  Tokyo 区部 一般道路 12時間平均 = 18.3 km/h, Source ID [#19]
#   Definitions: MLIT 旅客自動車運送事業等報告規則 — 実働率, 実車率, 走行キロ, 実車キロ

# ====== SIMULATION ENGINE SELECTION (v6.1, Phase 0 of shift-time rewrite) ======
# Selects which trip-generation engine to use:
#   legacy     = trip-count-driven loop with rejection-resampling (v6.0 default)
#   shift_time = shift-time-driven loop with DUAL_MODE state, no resampling (v7.0)
# During the v6.1 → v7.0 transition phases (1-7 of DESIGN.md), both engines coexist.
# Phase 7 will remove the legacy engine and make shift_time the only option.
taxi.simulation.engine=shift_time

# ====== DIRECTORY CONFIGURATION ======

input.directory=${PFLOW_HOME}/data/
output.directory=${PFLOW_HOME}/output/trips/taxi/tokyo/

# ====== FLEET CONFIGURATION (THTA FY2024 — 令和6年度) ======
# Source: THTA 令和6年度事業報告書 p.7 §② [#1]
# Verbatim: 特別区・武三地区 36,002両 (法人 27,241 + 個人 8,761)

# Total registered taxis (一般型タクシー: 法人 + 個人)
taxi.total.registered=36002

# Operating rate 実働率 (annual avg, FY2024) — 延実働車両数 / 延実在車両数
# THTA FY2024 p.1: 特別区・武三 = 68.6%
# Pre-COVID peak (R元/2019): 74.3%; COVID trough (R2/2020): 60.8%
taxi.operating.rate=0.686

# Active daily fleet (= taxi.total.registered × taxi.operating.rate)
taxi.fleet.size=24697

# ====== TRIP CONFIGURATION (THTA FY2024 p.13 [資料5-1]) ======
# 運送回数/active-taxi/day FY2024 = 25.3 (was 26.2 in FY2023)
# Pre-COVID peak (R元/2019): 27.2; COVID trough: 21.2
#
# NOTE on trip generation calibration: if simulation produces fewer than 25 trips/taxi,
# it is likely the spatial-validation retry budget (default 50) is being exhausted.
# Recommended: increase retry budget to 200 in TaxiSimulation.GENERATE_RETRY_LIMIT
# before reducing this target.
taxi.trips.average=25
taxi.trips.min=18
taxi.trips.max=45
taxi.trips.stddev=4.0

# ====== DISTANCE PARAMETERS (THTA FY2024 p.13 1車1回当り 実車㌔) ======
# Avg loaded km per trip = 4.6 (FY2024); 4.5 (FY2023)
# Total km/active-taxi/day (loaded + empty) = 243.7 (FY2024)

trip.distance.average=4.6
trip.distance.stddev=3.0
trip.distance.min=0.5
trip.distance.max=15.0

# ====== v7.0 LOG-NORMAL DISTANCE PARAMETERS (Phase 3 / B1, DESIGN.md §2.6) ======
# Used only when taxi.simulation.engine=shift_time. Legacy engine ignores these.
#
# Loaded leg: lognormal(mu = ln(trip.distance.average) - sigma^2/2, sigma=loaded.sigma)
#   bounded to [trip.distance.min, trip.distance.max].
#   Right-skewed (matches THTA panel distribution shape better than truncated Gaussian).
#   The -sigma^2/2 correction makes the arithmetic mean equal trip.distance.average.
# Empty leg:  lognormal(mu = ln(empty.mean.km) - sigma^2/2, sigma=empty.sigma)
#   bounded to [0.3, 12] km.
#   Empty-leg sampling is wired in Phase 4 (DUAL_MODE) — these keys are loaded
#   in Phase 3 but unused until then.
#
# 実車率 (loaded-km ratio) emerges by construction from this cycle math:
#     loaded_mean / (loaded_mean + empty_mean) = 4.6 / (4.6 + 5.1) = 47.4%
# matching THTA FY2024 target of 47.5% within 0.1pp without tuning.

trip.distance.loaded.sigma=0.6
trip.distance.empty.mean.km=5.1
trip.distance.empty.sigma=0.7

# Spiral-grid projection radius (km): when a sampled dropoff position fails
# spatial validation, search outward in 50m steps × 8 angles for the nearest
# valid land cell. Default 0.5 km (500 m) per DESIGN.md §2.6.
spatial.projection.radius.km=0.5

# ====== TRIP GENERATION RETRY BUDGET (v6.0 fix) ======
# Spatial-validation retry budget per trip-pair generation attempt.
# Previously hardcoded at 50 in TaxiSimulation.java; with FY2024 calibration
# (24,697 active fleet, 25.3 trips target) the 50-attempt cap exhausted in
# dense zones with strong water/river constraints (Sumida River, Tokyo Bay
# coast, Tama River), causing each taxi to terminate at ~16 trips instead
# of 25.3 (a 35% shortfall). Raising to 200 eliminates this artifact at
# small runtime cost (~10-20% increase in sim duration).
taxi.trip.generation.max.attempts=200

# ====== NEARBY TRIP LOGIC ======

use.nearby.trips=true
nearby.trip.probability=0.80
nearby.trip.radius.km=2.5

# ====== SHIFT CONFIGURATION ======

shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

shift.start.1.time=06:00
shift.start.1.probability=0.40

shift.start.2.time=14:00
shift.start.2.probability=0.30

shift.start.3.time=22:00
shift.start.3.probability=0.30

# ====== SIMULATION TIME PARAMETERS ======

sim.start.time=06:00
sim.duration.hours=24
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======

taxi.average.speed=18
distance.manhattan.factor=1.4
taxi.pickup.time=300
taxi.break.time=600

# ====== CITY & GEOGRAPHICAL PARAMETERS ======

city.name=Tokyo

city.bounds.min.lon=139.55
city.bounds.max.lon=139.92
city.bounds.min.lat=35.50
city.bounds.max.lat=35.82

earth.radius.km=6371.0

