# ====== FARE PARAMETERS (2024/2025 OFFICIAL RATES) ======

taxi.fare.base=500
taxi.fare.base.distance=1.096
taxi.fare.per.km=392
taxi.fare.waiting.per.hour=3780
taxi.fare.night.surcharge=1.20
taxi.fare.night.start=22:00
taxi.fare.night.end=05:00

# ====== TAXI TYPE DISTRIBUTION (v6.x legacy: 3-type) ======
# Used when taxi.simulation.engine=legacy. Must sum to 1.0.

taxi.type.local.prob=0.65
taxi.type.citywide.prob=0.25
taxi.type.hub.prob=0.10

taxi.type.local.familiar.radius.km=5.0

# ====== TAXI TYPE DISTRIBUTION (v7.0 shift-time: 5-type) ======
# Used when taxi.simulation.engine=shift_time. Must sum to 1.0.
# Default Tokyo 特別区・武三 FY2024 composition; APP_PREFERRED is the sensitivity
# parameter (range 0.20–0.60, with LOCAL+CITYWIDE absorbing per 10:3 ratio,
# HUB and RIDE_HAIL_PRHS held fixed).
#
# Reallocation formula (DESIGN.md §2.2):
#   LOCAL    = (10/13) * (0.90 - APP_PREFERRED)
#   CITYWIDE = (3/13)  * (0.90 - APP_PREFERRED)
#   APP_PREFERRED = variable
#   HUB      = 0.095 (fixed)
#   RIDE_HAIL_PRHS = 0.005 (fixed)

# Defaults per DESIGN.md §2.2 formula at x=APP_PREFERRED=0.20:
#   HUB = 0.095 (fixed); RIDE_HAIL_PRHS = 0.005 (fixed); APP_PREFERRED = x = 0.20
#   LEGACY_LOCAL    = (10/13) × (0.90 - 0.20) = 0.5385
#   LEGACY_CITYWIDE = (3/13)  × (0.90 - 0.20) = 0.1615
# Sum = 1.000. (DESIGN.md §2.1 listed 0.500/0.150 which sums to 0.95 —
# inconsistent with the §2.2 formula. Config follows the formula.)
taxi.type.local.share=0.5385
taxi.type.citywide.share=0.1615
taxi.type.app_preferred.share=0.200
taxi.type.hub.share=0.095
taxi.type.ride_hail_prhs.share=0.005

# ====== PER-TYPE MODE MIX (v7.0) ======
# Mode-mix probabilities sum to 1.0 per row.
# Industry estimate; sensitivity-analyzed in §7 (Sobol indices).
# RIDE_HAIL_PRHS forced to 0/100/0 by regulation (Road Transport Act 78-3).

taxi.type.local.mode.street=0.70
taxi.type.local.mode.app=0.25
taxi.type.local.mode.stand=0.05

taxi.type.citywide.mode.street=0.60
taxi.type.citywide.mode.app=0.30
taxi.type.citywide.mode.stand=0.10

taxi.type.app_preferred.mode.street=0.20
taxi.type.app_preferred.mode.app=0.75
taxi.type.app_preferred.mode.stand=0.05

taxi.type.hub.mode.street=0.10
taxi.type.hub.mode.app=0.30
taxi.type.hub.mode.stand=0.60

taxi.type.ride_hail_prhs.mode.street=0.00
taxi.type.ride_hail_prhs.mode.app=1.00
taxi.type.ride_hail_prhs.mode.stand=0.00

# ====== AT_STAND QUEUE WAIT TIMES (v7.0) ======
# Exponential distribution mean (minutes) for FIFO queue wait at stands.
# Documented assumption; no published primary source. Sensitivity-analyzed in §7.

taxi.stand.wait.airport.mean.minutes=8
taxi.stand.wait.station.mean.minutes=12
taxi.stand.wait.entertainment.mean.minutes=6

# ====== APP_PREFERRED & RIDE_HAIL_PRHS BEHAVIORAL CONSTRAINTS (v7.0) ======
# APP_PREFERRED: citywide cruising, no familiar zone (per P1-Q2 decision)
# RIDE_HAIL_PRHS: citywide cruising + MLIT operating-window restriction

taxi.type.app_preferred.familiar.radius.km=0.0
taxi.type.ride_hail_prhs.familiar.radius.km=0.0

# ====== RIDE_HAIL_PRHS REGULATORY WINDOWS (v7.0) ======
# MLIT-permitted operating windows for 自家用車活用事業 in 特別区・武三.
# Format: HHMM-HHMM,DAYS where DAYS is a comma-list of {Mon,Tue,...,Sat,Sun} or "Mon-Fri" range.
# Used when taxi_config.engine=shift_time. Two scenarios documented:
#   FY2024 baseline (4 windows; original R6.3.13 publication):
#     prhs.window.1=07:00-10:00,Mon-Fri
#     prhs.window.2=16:00-19:00,Fri,Sat
#     prhs.window.3=00:00-04:00,Sat
#     prhs.window.4=10:00-13:00,Sun
#   R8 contraction (1 window only; current R8.2.26 publication):
#     prhs.window.1=07:00-10:00,Mon-Fri
# Default below = FY2024 baseline (matches the calibration period for the paper).
# Use taxi_config_tokyo_r8.properties for the contraction scenario.

prhs.window.count=4
prhs.window.1=07:00-10:00,Mon-Fri
prhs.window.2=16:00-19:00,Fri,Sat
prhs.window.3=00:00-04:00,Sat
prhs.window.4=10:00-13:00,Sun

# ====== ZONE CLUSTERING ======

zone.cluster.min.zones=3
zone.cluster.max.zones=5
zone.cluster.min.distance.km=5.0
zone.cluster.max.distance.km=10.0

# ====== ZONE CONFIGURATION ======

zones.file=zones.csv

# ====== TIME PERIODS FOR ATTRACTIVENESS ======

time.period.1.start=06:00
time.period.1.end=18:00
time.period.2.start=18:00
time.period.2.end=24:00

# ====== ATTRACTIVENESS COEFFICIENTS ======

attractiveness.beta1.jobs=1.0
attractiveness.beta2.shops=0.8
attractiveness.beta3.nightlife=0.6
attractiveness.beta4.residential=0.5

# ====== VALIDATION TARGETS (THTA FY2024 audit-clean) ======
# Derived: 36,002 fleet × 0.686 実働率 × 25.3 trips/active-taxi/day = 624,830 trips/day

validation.daily.trips=624830
validation.avg.trips.per.taxi=25.3
validation.avg.trip.distance.min=3.5
validation.avg.trip.distance.max=6.0
validation.nearby.trip.percentage=0.70

# 実働率 (operating rate, FY2024 annual avg): 68.6%
validation.operating.rate=0.686

# 実車率 (loaded-km ratio, FY2024 annual avg): 47.5%
# Equivalent: empty-running distance ratio = 1 - 0.475 = 0.525
validation.loaded.distance.ratio=0.475

# 走行 km/active-taxi/day FY2024: 243.7
validation.km.per.active.taxi=243.7

# 日車営収 (daily revenue per active taxi, 税抜) FY2024: ¥56,139
validation.revenue.per.active.taxi=56139

# ====== CITY BOUNDARY (PREFECTURE POLYGONS) ======

city.prefecture.codes=13,14

# ====== SPATIAL VALIDATION ======

spatial.validation.enabled=true
spatial.shapefile.dir=src/shared/gm-jp/
spatial.river.buffer.km=0.15

# ====== TRANSPORT NETWORK INDEX ======

transport.index.enabled=true
transport.station.proximity.max.km=2.0
transport.station.bias.probability=0.4

# ====== ZONE ENRICHMENT ======

zone.enrichment.enabled=false
zone.enrichment.station.coverage.km=1.5
zone.enrichment.settlement.coverage.km=2.0

# ====== OUTPUT CONFIGURATION ======

