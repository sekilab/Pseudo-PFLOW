# ══════════════════════════════════════════════════════════════════════════
#  KANAGAWA TAXI ABM - COMPLETE CONFIGURATION FILE
#  Version 5.0 - Updated with 2024/2025 statistics
# ══════════════════════════════════════════════════════════════════════════
#
# DATA SOURCES:
#   Fleet size:  MLIT Japan / Tokyo Hire-Taxi Association (THTA) / Statista
#   Fare rates:  Tokyo Hire-Taxi Association official rates table
#                Kyoto Taxi Association official fare list
#                nagoyastation.com / osakastation.com local fare info
#                taxi-calculator.com tariff ordinances (Jan 2025)
#                gobytaxi.com per-km rates
#   Demand:      Tokyo taxi survey, MLIT transport statistics
#   General:     japan-guide.com, japan-dev.com taxi guides

# ====== DIRECTORY CONFIGURATION ======

input.directory=N:/PFLOW/data/
output.directory=N:/PFLOW/output/taxi/kanagawa/

# ====== FLEET CONFIGURATION (2024/2025 DATA) ======

# Total registered taxis in Kanagawa
taxi.total.registered=12500

# Operating rate (fraction active daily)
taxi.operating.rate=0.77

# Simulation fleet size
taxi.fleet.size=9625

# ====== TRIP CONFIGURATION ======

taxi.trips.average=21
taxi.trips.min=14
taxi.trips.max=38
taxi.trips.stddev=3.5

# ====== DISTANCE PARAMETERS ======

trip.distance.average=6.0
trip.distance.stddev=3.5
trip.distance.min=0.5
trip.distance.max=15.0

# ====== NEARBY TRIP LOGIC ======

use.nearby.trips=true
nearby.trip.probability=0.80
nearby.trip.radius.km=2.5

# ====== SHIFT CONFIGURATION ======

shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

shift.start.1.time=06:00
shift.start.1.probability=0.40

shift.start.2.time=14:00
shift.start.2.probability=0.30

shift.start.3.time=22:00
shift.start.3.probability=0.30

# ====== SIMULATION TIME PARAMETERS ======

sim.start.time=06:00
sim.duration.hours=24
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======

taxi.average.speed=22
distance.manhattan.factor=1.4
taxi.pickup.time=300
taxi.break.time=600

# ====== CITY & GEOGRAPHICAL PARAMETERS ======

city.name=Kanagawa

city.bounds.min.lon=139.20
city.bounds.max.lon=139.85
city.bounds.min.lat=35.12
city.bounds.max.lat=35.65

earth.radius.km=6371.0

# ====== HOTSPOT CONFIGURATION ======

use.hotspots=true
hotspot.probability=0.70
hotspot.airport.night.multiplier=2.0
hotspot.night.start=22:00
hotspot.night.end=06:00

# ====== HOTSPOT LOCATIONS ======

hotspot.1.name=Yokohama Station
hotspot.1.lon=139.6222
hotspot.1.lat=35.466
hotspot.1.weight=0.20
hotspot.1.type=station

hotspot.2.name=Kawasaki Station
hotspot.2.lon=139.6967
hotspot.2.lat=35.5321
hotspot.2.weight=0.18
hotspot.2.type=station

hotspot.3.name=Shin-Yokohama Station
hotspot.3.lon=139.6181
hotspot.3.lat=35.5069
hotspot.3.weight=0.15
hotspot.3.type=station

hotspot.4.name=Haneda Airport
hotspot.4.lon=139.7798
hotspot.4.lat=35.5494
hotspot.4.weight=0.12
hotspot.4.type=airport

hotspot.5.name=Fujisawa Station
hotspot.5.lon=139.487
hotspot.5.lat=35.3378
hotspot.5.weight=0.08
hotspot.5.type=station

hotspot.6.name=Kamakura Station
hotspot.6.lon=139.5532
hotspot.6.lat=35.3189
hotspot.6.weight=0.07
hotspot.6.type=station

hotspot.7.name=Odawara Station
hotspot.7.lon=139.1532
hotspot.7.lat=35.2558
hotspot.7.weight=0.07
hotspot.7.type=station

hotspot.8.name=Sagamihara Station
hotspot.8.lon=139.373
hotspot.8.lat=35.5704
hotspot.8.weight=0.06
hotspot.8.type=station

hotspot.9.name=Yokosuka Central Station
hotspot.9.lon=139.671
hotspot.9.lat=35.278
hotspot.9.weight=0.07
hotspot.9.type=station

# ====== FARE PARAMETERS (2024/2025 OFFICIAL RATES) ======

taxi.fare.base=500
taxi.fare.base.distance=1.200
taxi.fare.per.km=375
taxi.fare.waiting.per.hour=3600
taxi.fare.night.surcharge=1.20
taxi.fare.night.start=22:00
taxi.fare.night.end=05:00

# ====== TAXI TYPE DISTRIBUTION ======

taxi.type.local.prob=0.65
taxi.type.citywide.prob=0.25
taxi.type.hub.prob=0.10

taxi.type.local.familiar.radius.km=5.0

# ====== ZONE CLUSTERING ======

zone.cluster.min.zones=3
zone.cluster.max.zones=5
zone.cluster.min.distance.km=5.0
zone.cluster.max.distance.km=10.0

# ====== ZONE CONFIGURATION ======

zones.file=zones.csv

# ====== TIME PERIODS FOR ATTRACTIVENESS ======

time.period.1.start=06:00
time.period.1.end=18:00
time.period.2.start=18:00
time.period.2.end=24:00

# ====== ATTRACTIVENESS COEFFICIENTS ======

attractiveness.beta1.jobs=1.0
attractiveness.beta2.shops=0.8
attractiveness.beta3.nightlife=0.6
attractiveness.beta4.residential=0.5

# ====== VALIDATION TARGETS ======

validation.daily.trips=140000
validation.avg.trips.per.taxi=21.0
validation.avg.trip.distance.min=4.0
validation.avg.trip.distance.max=8.0
validation.nearby.trip.percentage=0.70

# ====== CITY BOUNDARY (PREFECTURE POLYGONS) ======

city.prefecture.codes=14

# ====== SPATIAL VALIDATION ======

spatial.validation.enabled=true
spatial.shapefile.dir=src/taxi/gm-jp/
spatial.river.buffer.km=0.15

# ====== TRANSPORT NETWORK INDEX ======

transport.index.enabled=true
transport.station.proximity.max.km=2.0
transport.station.bias.probability=0.4

# ====== ZONE ENRICHMENT ======

zone.enrichment.enabled=false
zone.enrichment.station.coverage.km=1.5
zone.enrichment.settlement.coverage.km=2.0

# ====== OUTPUT CONFIGURATION ======

export.format=csv
export.trajectories=true
export.compression=none
export.datetime.format=MM/dd/yyyy HH:mm
export.timestamp.format=yyyyMMdd_HHmmss

# ====== RANDOM SEED ======

random.seed=12345

# ══════════════════════════════════════════════════════════════════════════

# ====== SPATIAL DISTRIBUTION (V5.2) ======
# Mode: "gaussian" (natural bell-curve decay) or "uniform" (flat density)
spatial.distribution.mode=gaussian
# Gaussian sigma = radius / sigma_factor (higher = tighter around center)
spatial.gaussian.sigma.factor=2.5
# Max distance clip = radius * clip_factor (soft edge overflow)
spatial.gaussian.clip.factor=1.2
# Aspect ratio: breaks circular symmetry for city shape
spatial.aspect.x=1.1
spatial.aspect.y=1.0
# Micro-jitter in meters: adds tiny random offset to break geometric patterns
spatial.jitter.meters=50
