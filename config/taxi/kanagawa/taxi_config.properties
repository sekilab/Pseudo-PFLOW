# ══════════════════════════════════════════════════════════════════════════
#  KANAGAWA TAXI ABM - CONFIGURATION FILE
#  Based on Kanagawa Prefecture taxi operations (sprawling suburban)
# ══════════════════════════════════════════════════════════════════════════

# ====== DIRECTORY CONFIGURATION ======
input.directory=N:/PFLOW/data/
output.directory=N:/PFLOW/output/kanagawa/

# ====== CITY & GEOGRAPHICAL PARAMETERS ======
city.name=Kanagawa
city.bounds.min.lon=139.30
city.bounds.max.lon=139.70
city.bounds.min.lat=35.20
city.bounds.max.lat=35.60

earth.radius.km=6371.0

# ====== FLEET CONFIGURATION ======
taxi.total.registered=10000
taxi.operating.rate=0.75
taxi.fleet.size=7500

# ====== TRIP CONFIGURATION ======
taxi.trips.average=20
taxi.trips.min=14
taxi.trips.max=32
taxi.trips.stddev=3.0

# ====== DISTANCE PARAMETERS ======
# Kanagawa trips are longer due to suburban spread
trip.distance.average=7.0
trip.distance.stddev=4.0
trip.distance.min=0.5
trip.distance.max=30.0

# ====== NEARBY TRIP LOGIC ======
use.nearby.trips=true
nearby.trip.probability=0.65
nearby.trip.radius.km=3.0

# ====== SHIFT CONFIGURATION ======
shift.duration.min=12
shift.duration.max=16
shift.duration.average=14
shift.duration.stddev=1.0

shift.start.1.time=06:00
shift.start.1.probability=0.45
shift.start.2.time=14:00
shift.start.2.probability=0.30
shift.start.3.time=22:00
shift.start.3.probability=0.25

# ====== SIMULATION TIME ======
sim.start.time=06:00
sim.duration.hours=24
sim.timestep.seconds=60

# ====== ROUTING PARAMETERS ======
# Kanagawa: faster suburban roads
taxi.average.speed=24
distance.manhattan.factor=1.35
taxi.pickup.time=360
taxi.break.time=600

# ====== HOTSPOT CONFIGURATION ======
use.hotspots=true
hotspot.probability=0.70
hotspot.airport.night.multiplier=1.5
hotspot.night.start=22:00
hotspot.night.end=06:00

# ====== FARE PARAMETERS (Kanagawa Prefecture rates) ======
taxi.fare.base=500
taxi.fare.base.distance=1.2
taxi.fare.per.km=310
taxi.fare.waiting.per.hour=2940
taxi.fare.night.surcharge=1.20
taxi.fare.night.start=22:00
taxi.fare.night.end=05:00

# ====== RANDOM SEED ======
random.seed=56789

# ====== TAXI TYPE DISTRIBUTION ======
# Kanagawa: more LOCAL due to suburban spread, fewer HUB
taxi.type.local.prob=0.70
taxi.type.citywide.prob=0.20
taxi.type.hub.prob=0.10
taxi.type.local.familiar.radius.km=6.0

# ====== ZONE CLUSTERING ======
zone.cluster.min.zones=3
zone.cluster.max.zones=5
zone.cluster.min.distance.km=5.0
zone.cluster.max.distance.km=15.0

# ====== ZONE CONFIGURATION ======
zones.file=zones.csv

# ====== TIME PERIODS ======
time.period.1.start=06:00
time.period.1.end=18:00
time.period.2.start=18:00
time.period.2.end=24:00

# ====== ATTRACTIVENESS COEFFICIENTS ======
attractiveness.beta1.jobs=1.0
attractiveness.beta2.shops=0.7
attractiveness.beta3.nightlife=0.5
attractiveness.beta4.residential=0.7

# ====== VALIDATION TARGETS ======
validation.daily.trips=150000
validation.avg.trips.per.taxi=20
validation.avg.trip.distance.min=5.0
validation.avg.trip.distance.max=9.0

# ====== SPATIAL VALIDATION ======
# ====== CITY BOUNDARY (PREFECTURE POLYGONS) ======
city.prefecture.codes=14,13

spatial.validation.enabled=true
spatial.shapefile.dir=src/taxi/gm-jp/
spatial.river.buffer.km=0.15

# ====== TRANSPORT NETWORK INDEX ======
transport.index.enabled=true
transport.station.proximity.max.km=2.0
transport.station.bias.probability=0.4

# ====== ZONE ENRICHMENT FROM SHAPEFILES ======
zone.enrichment.enabled=false
zone.enrichment.station.coverage.km=1.5
zone.enrichment.settlement.coverage.km=2.0

# ====== OUTPUT CONFIGURATION ======
export.format=csv
export.trajectories=true
export.compression=none
export.datetime.format=MM/dd/yyyy HH:mm
export.timestamp.format=yyyyMMdd_HHmmss
